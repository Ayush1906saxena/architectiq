# ArchitectIQ, the whole platform on one machine:  docker compose up
#   web app  http://localhost:3000
#   API      http://localhost:8000/docs
# With no GROQ_API_KEY, the interviewer runs on the bundled Ollama (llama3.2, pulled on first start).
# Prebuilt images: ghcr.io/ayush1906saxena/architectiq-frontend and -backend (see README).
services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_INTERNAL_URL: http://backend:8000
    image: ghcr.io/ayush1906saxena/architectiq-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    image: ghcr.io/ayush1906saxena/architectiq-backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./content:/app/content:ro
      - ./data:/app/data
    environment:
      CONTENT_DIR: /app/content
      TTS_CACHE_DIR: /app/data/tts_cache
      DB_PATH: /app/data/architectiq.db
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Pulls the model once into the shared volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-llama3.2}"]
    restart: "no"

volumes:
  ollama_data:
